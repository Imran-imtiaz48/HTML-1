<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Styles</title>
  <link href="https://fonts.googleapis.com/css?family=Fira+Sans:400,400i,500,600,700i,800|Open+Sans|Roboto:300i,400,400i,500,500i,700,700i,900,900i" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fff;
    }

    em {
      font-weight: 600;
      color: pink;
    }

    h1 {
      font-family: 'Roboto', sans-serif;
      position: absolute;
      top: 20px;
      left: 200px;
      z-index: 3;
      font-size: 20pt;
      color: purple;
    }

    h2 {
      font-family: Tahoma, Helvetica, sans-serif;
      position: absolute;
      top: 60px;
      left: 150px;
      z-index: 3;
      font-size: 20pt;
      color: blue;
    }

    p {
      font-size: 12pt;
      font-family: Arial, sans-serif;
    }

    .background_image {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      width: 100%;
      height: auto;
    }

    .foreground_image {
      position: absolute;
      top: 25px;
      left: 100px;
      z-index: 2;
      max-width: 100%;
      height: auto;
    }

    .text1 {
      position: absolute;
      top: 120px;
      left: 150px;
      z-index: 3;
      font-size: 20pt;
      font-family: Tahoma, Geneva, sans-serif;
    }

    .text2 {
      position: absolute;
      top: 150px;
      left: 150px;
      z-index: 3;
      font-size: 40pt;
      font-family: Tahoma, Geneva, sans-serif;
      color: red;
    }
  </style>
</head>
<body>

  <h1>FCA UNAM</h1>
  <h2>Desarrollo de sitios web con transacciones en línea</h2>

  <img src="images/background_image.png" class="background_image" alt="Background" />
  <img src="images/foreground_image.png" class="foreground_image" alt="Foreground" />

  <p class="text1">
    This text has the <em>font-size</em> style applied to it, making it 20pt.
  </p>

  <p class="text1" style="color: deepskyblue;">
    This text has the <em>font-size</em> and <em>color</em> styles applied to it, making it 20pt and deep sky blue.
  </p>

</body>
</html>
